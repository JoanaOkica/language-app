# Local development configuration for the Supabase CLI.
project_id = "linguafox"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500          # caps how much a single PostgREST query can return

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
# Require a confirmed address before the account becomes usable.
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
